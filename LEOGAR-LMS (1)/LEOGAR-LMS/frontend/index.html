<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEOGAR – Learning Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#0B4D2E;--g2:#146c41;--y:#F5B700;--y2:#fff4cc;--bg:#fff;--soft:#f3f8f4;--ink:#16231c;--mut:#5d6f64;--line:#dfe9e2;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
h1,h2,h3,.brand{font-family:Fraunces,Georgia,serif;color:var(--g)}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--g);color:#fff;padding:12px 22px;border-radius:10px;font-weight:600;transition:.2s}
.btn:hover{background:var(--g2)}.btn.y{background:var(--y);color:#2b2200}.btn.y:hover{background:#ffc928}
.btn.o{background:#fff;color:var(--g);border:2px solid var(--g)}.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
/* auth */
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.hero{background:var(--g);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-120px;bottom:-120px;width:380px;height:380px;border-radius:50%;background:var(--y);opacity:.95}
.hero h1{color:#fff;font-size:clamp(34px,4.4vw,56px);line-height:1.1;margin:28px 0 18px;max-width:520px}
.hero p{color:#d3e8da;max-width:440px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;color:#fff}
.logo{width:38px;height:38px;border-radius:10px;background:var(--y);display:grid;place-items:center;color:var(--g);font-weight:700}
.feat{display:flex;gap:26px;margin-top:34px;position:relative;z-index:1;flex-wrap:wrap}
.feat div{font-size:14px;color:#d3e8da}.feat b{display:block;color:var(--y);font-size:26px;font-family:Fraunces}
.formwrap{display:grid;place-items:center;padding:36px}
.box{width:100%;max-width:430px}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:5px;margin:18px 0 22px}
.tabs button{flex:1;padding:10px;background:none;border-radius:9px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--g);color:#fff}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
label i{color:var(--red);font-style:normal}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus{border-color:var(--g);outline:none;box-shadow:0 0 0 3px var(--y2)}
input.bad{border-color:var(--red)}.err{color:var(--red);font-size:12px;min-height:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box .btn{width:100%;margin-top:18px}
/* app */
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav .in{max-width:1180px;margin:auto;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
nav .brand{color:var(--g)}.who{display:flex;align-items:center;gap:12px;font-size:14px}
.av{width:36px;height:36px;border-radius:50%;background:var(--y);color:var(--g);display:grid;place-items:center;font-weight:700}
.wrap{max-width:1180px;margin:auto;padding:28px 22px 60px}
.banner{background:var(--g);color:#fff;border-radius:20px;padding:30px 34px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-bottom:6px solid var(--y)}
.banner h2{color:#fff;font-size:28px}.banner p{color:#cfe6d6}
.stats{display:flex;gap:14px}.stat{background:rgba(255,255,255,.1);padding:12px 20px;border-radius:12px;text-align:center}
.stat b{font-size:26px;color:var(--y);font-family:Fraunces;display:block}.stat span{font-size:12px;color:#cfe6d6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px;margin-top:22px}
.card{border:1px solid var(--line);border-radius:18px;padding:22px;background:#fff;display:flex;flex-direction:column;gap:12px;transition:.2s}
.card:hover{box-shadow:0 12px 30px rgba(11,77,46,.12);transform:translateY(-3px)}
.ic{width:54px;height:54px;border-radius:14px;background:var(--y2);display:grid;place-items:center;font-size:26px}
.tag{font-size:12px;background:var(--soft);color:var(--g);padding:3px 10px;border-radius:99px;font-weight:600}
.tag.p{background:var(--y);color:#2b2200}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y))}
.mut{color:var(--mut);font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.back{background:none;color:var(--g);font-weight:600;margin-bottom:14px}
.lay{display:grid;grid-template-columns:1fr 340px;gap:22px;margin-top:10px}
.player{aspect-ratio:16/9;background:#0e1a13;border-radius:16px;overflow:hidden;border:3px solid var(--g)}
.player iframe{width:100%;height:100%;border:0}
.side{border:1px solid var(--line);border-radius:16px;overflow:hidden;align-self:start}
.side h3{background:var(--g);color:#fff;padding:14px 18px;font-size:17px}
.v{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;font-size:14px}
.v:hover{background:var(--soft)}.v.on{background:var(--y2);border-left:5px solid var(--y)}.v.lock{opacity:.45;cursor:not-allowed}
.n{min-width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--g);font-size:13px}
.v.done .n{background:var(--g);color:#fff}
.tst{padding:16px;background:var(--soft)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.q p{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.opt:hover{border-color:var(--g)}.opt input{width:auto;accent-color:var(--g)}
.opt.ok{background:#e3f5e9;border-color:#2e9e5b}.opt.no{background:#fdeceb;border-color:var(--red)}
.res{text-align:center;padding:36px;border-radius:20px;border:2px solid var(--y);background:var(--y2);margin-bottom:20px}
.res .big{font-size:60px;font-family:Fraunces;color:var(--g);font-weight:700}
/* report */
.rep{max-width:820px;margin:20px auto;border:3px solid var(--g);border-radius:6px;padding:10px;background:#fff}
.rep .inn{border:1px solid var(--y);padding:38px 44px;position:relative}
.rh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--y);padding-bottom:16px}
.rep h1{font-size:34px;margin:22px 0 4px;text-align:center}
.pill{display:block;width:max-content;margin:8px auto 22px;background:var(--g);color:#fff;padding:6px 22px;border-radius:99px;font-weight:600}
.tb{width:100%;border-collapse:collapse;margin:10px 0}
.tb td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:15px}.tb td:first-child{color:var(--mut);width:38%}.tb td:last-child{font-weight:600}
.sg{display:flex;justify-content:space-between;margin-top:56px;font-size:13px;color:var(--mut)}
.sg div{border-top:1.5px solid var(--ink);padding-top:6px;min-width:170px;text-align:center}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:12px 24px;border-radius:12px;border-bottom:4px solid var(--y);z-index:50;font-weight:500}
@media(max-width:900px){.auth{grid-template-columns:1fr}.hero{padding:30px;min-height:300px}.lay{grid-template-columns:1fr}.two{grid-template-columns:1fr}.rep .inn{padding:22px}.who span{display:none}}
@media print{body *{visibility:hidden}.rep,.rep *{visibility:visible}.rep{position:absolute;left:0;top:0;width:100%;margin:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>

const $=s=>document.querySelector(s), app=$('#app');
let TOKEN=localStorage.getItem('ls_token'),ME=null,PROG={},COURSES=[],PASS_MARK=60;
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'Something went wrong');e.field=d.field;throw e}return d}
const user=()=>ME;
const prog=(u,id)=>PROG[id]||(PROG[id]={done:[],tp:[0,0,0,0,0],bests:[],best:null,passed:false});
async function load(){const[a,c]=await Promise.all([api('/me'),api('/courses')]);ME=a.user;PROG=a.progress;COURSES=c.courses;PASS_MARK=c.pass}
async function enter(d){TOKEN=d.token;localStorage.setItem('ls_token',TOKEN);await load();home()}
const yt=u=>{const m=u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{6,})/);return 'https://www.youtube-nocookie.com/embed/'+(m?m[1]:u)+'?rel=0'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
let S={tab:'login',course:null,vid:0};

/* ---------- AUTH ---------- */
function authView(){
 const su=S.tab==='signup';
 const f=(id,l,t='text',ph='')=>`<label for="${id}">${l} <i>*</i></label><input id="${id}" type="${t}" placeholder="${ph}" autocomplete="off"><div class="err" id="e_${id}"></div>`;
 app.innerHTML=`<div class="auth"><section class="hero"><div class="brand"><span class="logo">L</span>LEOGAR</div>
 <div><h1>Learn with videos. Prove it with a test.</h1><p>Watch short lessons, take the assessment and earn a Success Report that shows your skills.</p>
 <div class="feat"><div><b>5</b>Courses</div><div><b>25</b>Video lessons</div><div><b>${PASS_MARK}%</b>To pass</div></div></div><span></span></section>
 <section class="formwrap"><div class="box"><h2 style="font-size:30px">${su?'Create your account':'Welcome back'}</h2>
 <p class="mut">${su?'All fields are required.':'Log in to continue learning.'}</p>
 <div class="tabs"><button class="${su?'':'on'}" onclick="S.tab='login';authView()">Log in</button><button class="${su?'on':''}" onclick="S.tab='signup';authView()">Sign up</button></div>
 <div id="fm">${su?f('name','Full name','text','Your full name')+`<div class="two"><div>${f('phone','Phone number','tel','10-digit number')}</div><div>${f('college','College name','text','Your college')}</div></div>`+f('email','Email ID','email','you@example.com')+`<div class="two"><div>${f('pw','Password','password','Min 6 characters')}</div><div>${f('pw2','Re-enter password','password','Repeat password')}</div></div>`
 :f('email','Email ID','email','you@example.com')+f('pw','Password','password','Your password')}
 <button class="btn" id="go">${su?'Create account':'Log in'}</button></div></div></section></div>`;
 $('#go').onclick=su?signup:login;
 app.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()}));
}
function bad(id,m){$('#'+id).classList.add('bad');$('#e_'+id).textContent=m;return 1}
async function signup(){
 app.querySelectorAll('input').forEach(i=>i.classList.remove('bad'));app.querySelectorAll('.err').forEach(e=>e.textContent='');
 const v=id=>$('#'+id).value.trim();let e=0;
 if(v('name').length<3)e|=bad('name','Enter your full name');
 if(!/^[6-9]\d{9}$/.test(v('phone')))e|=bad('phone','Enter a valid 10-digit number');
 if(!v('college'))e|=bad('college','College name is required');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v('email')))e|=bad('email','Enter a valid email');
 if(v('pw').length<6)e|=bad('pw','Use at least 6 characters');
 if(!v('pw2')||v('pw2')!==v('pw'))e|=bad('pw2','Passwords do not match');
 if(e)return;
 try{await enter(await api('/signup','POST',{name:v('name'),phone:v('phone'),college:v('college'),email:v('email'),pw:v('pw'),pw2:v('pw2')}));toast('Account created. Welcome!')}catch(x){bad(x.field||'email',x.message)}
}
async function login(){
 app.querySelectorAll('.err').forEach(e=>e.textContent='');
 const k=$('#email').value.trim();if(!k)return bad('email','Enter your email');
 try{await enter(await api('/login','POST',{email:k,pw:$('#pw').value}))}catch(x){bad(x.field||'pw',x.message)}
}
function logout(){localStorage.removeItem('ls_token');TOKEN=ME=null;S.tab='login';authView()}

/* ---------- SHELL ---------- */
function shell(body){const u=user();
 app.innerHTML=`<nav><div class="in"><div class="brand" style="cursor:pointer" onclick="home()"><span class="logo">L</span>LEOGAR</div>
 <div class="who"><span>${esc(u.name)}<br><small class="mut">${esc(u.college)}</small></span><div class="av">${esc(u.name[0].toUpperCase())}</div><button class="btn o" style="padding:8px 16px" onclick="logout()">Log out</button></div></div></nav><div class="wrap">${body}</div>`;scrollTo(0,0)}

/* ---------- DASHBOARD ---------- */
function home(){
 if(!ME)return authView();
 const u=user(),passed=COURSES.filter(c=>prog(u,c.id).passed).length,vids=COURSES.reduce((a,c)=>a+prog(u,c.id).tp.filter(Boolean).length,0);
 shell(`<div class="banner"><div><h2>Hello, ${esc(u.name.split(' ')[0])} 👋</h2><p>Watch each video, then pass its 10-question test to unlock the next lesson.</p></div>
 <div class="stats"><div class="stat"><b>${vids}/25</b><span>Lessons passed</span></div><div class="stat"><b>${passed}/5</b><span>Courses passed</span></div></div></div>
 <div class="grid">${COURSES.map(c=>{const p=prog(u,c.id),pc=p.tp.filter(Boolean).length*20;
 return `<div class="card"><div class="row"><div class="ic">${c.icon}</div>${p.passed?'<span class="tag p">✔ Passed</span>':`<span class="tag">${c.level}</span>`}</div>
 <h3>${c.title}</h3><p class="mut">${c.desc}</p><div class="bar"><i style="width:${pc}%"></i></div>
 <div class="row mut"><span>${p.tp.filter(Boolean).length}/5 lessons passed</span><span>${p.passed?'Score: '+p.score+'%':'In progress'}</span></div>
 <button class="btn ${p.passed?'y':''}" onclick="openCourse('${c.id}')">${p.passed?'View course':p.done.length?'Continue':'Start course'}</button></div>`}).join('')}</div>`);
}

/* ---------- COURSE ---------- */
function openCourse(id){S.course=id;const i=prog(0,id).tp.indexOf(0);S.vid=i<0?0:i;course()}
function course(){
 const c=COURSES.find(x=>x.id===S.course),p=prog(0,c.id),cur=c.videos[S.vid],w=p.done.includes(S.vid),t=p.tp[S.vid],np=p.tp.filter(Boolean).length;
 shell(`<button class="back" onclick="home()">← All courses</button>
 <div class="row" style="justify-content:flex-start;gap:14px"><div class="ic">${c.icon}</div><div><h2>${c.title}</h2><p class="mut">Lesson ${S.vid+1} of 5 · ${cur[0]}</p></div></div>
 <div class="lay" style="margin-top:20px"><div><div class="player"><iframe src="${yt(cur[1])}" allow="accelerometer;autoplay;encrypted-media;picture-in-picture" allowfullscreen title="${esc(cur[0])}"></iframe></div>
 <div class="row" style="margin-top:16px;flex-wrap:wrap"><h3>${cur[0]}</h3><div class="row" style="flex-wrap:wrap">
 <button class="btn ${w?'o':'y'}" ${w?'disabled':''} onclick="markDone()">${w?'✔ Watched':'Mark as watched'}</button>
 <button class="btn" ${w?'':'disabled'} onclick="test()">${t?'Retake lesson test':'Take lesson test (10 MCQs)'}</button></div></div>
 <p class="mut" style="margin-top:8px">${w?(t?'Test passed with '+p.bests[S.vid]+'%.':'Pass mark: '+PASS_MARK+'%. Pass this test to unlock the next lesson.'):'Finish the video, then mark it as watched to unlock this lesson\'s test.'}</p></div>
 <aside class="side"><h3>Course lessons</h3>${c.videos.map((v,i)=>{const lock=i>0&&!p.tp[i-1];
 return `<div class="v ${i===S.vid?'on':''} ${p.tp[i]?'done':''} ${lock?'lock':''}" onclick="${lock?"toast('Pass the previous lesson test to unlock this')":`S.vid=${i};course()`}"><span class="n">${p.tp[i]?'✔':lock?'🔒':i+1}</span><span>${v[0]}<br><small class="mut">${p.tp[i]?'Test passed · '+p.bests[i]+'%':'Test pending'}</small></span></div>`}).join('')}
 <div class="tst"><p class="mut" style="text-align:center">${np}/5 lesson tests passed</p>${p.passed?`<button class="btn y" style="width:100%;margin-top:8px" onclick="report()">📄 View Success Report</button>`:''}</div></aside></div>`);
}
async function markDone(){
 try{const d=await api('/progress','POST',{course:S.course,video:S.vid});prog(0,S.course).done=d.done}catch(x){return toast(x.message)}
 toast('Video marked as watched. Your lesson test is unlocked!');course();
}

/* ---------- TEST ---------- */
async function test(){
 const c=COURSES.find(x=>x.id===S.course),v=S.vid;let d;
 try{d=await api('/test/'+c.id+'/'+v)}catch(x){toast(x.message);return course()}
 S.qs=d.questions;
 shell(`<button class="back" onclick="course()">← Back to video</button><h2>Lesson ${v+1} Test: ${c.videos[v][0]}</h2>
 <p class="mut" style="margin:4px 0 20px">Answer all ${S.qs.length} questions. You need ${PASS_MARK}% to pass.</p>
 ${S.qs.map((q,i)=>`<div class="q"><p>${i+1}. ${esc(q[0])}</p>${q[1].map((o,j)=>`<label class="opt" style="font-weight:500;margin:8px 0 0"><input type="radio" name="q${i}" value="${j}">${esc(o)}</label>`).join('')}</div>`).join('')}
 <button class="btn y" onclick="submitTest()">Submit test</button>`);
}
async function submitTest(){
 const c=COURSES.find(x=>x.id===S.course),ans=[];
 for(let i=0;i<S.qs.length;i++){const r=document.querySelector(`input[name=q${i}]:checked`);if(!r)return toast('Please answer all questions');ans.push(+r.value)}
 let d;try{d=await api('/test/'+c.id+'/'+S.vid,'POST',{answers:ans})}catch(x){return toast(x.message)}
 PROG[c.id]=d.progress;const sc=d.score,pass=d.passed,Q=S.qs,last=d.progress.passed;
 const nxt=pass?(last?'<button class="btn" onclick="report()">📄 Get Success Report</button>':S.vid<4?'<button class="btn" onclick="S.vid++;course()">Next lesson</button>':''):'<button class="btn" onclick="test()">Retry test</button>';
 shell(`<div class="res"><div style="font-size:44px">${pass?'🎉':'💪'}</div><div class="big">${sc}%</div><h2>${pass?'Lesson test passed!':'Not passed this time'}</h2>
 <p class="mut" style="margin:6px 0 18px">${d.correctCount} of ${Q.length} correct. ${pass?(last?'You finished the course. Your Success Report is ready.':'The next lesson is unlocked.'):'Re-watch the video and try again.'}</p>
 ${nxt} <button class="btn o" onclick="course()">Back to course</button></div>
 <h3 style="margin-bottom:12px">Answer review</h3>${Q.map((q,i)=>`<div class="q"><p>${i+1}. ${esc(q[0])}</p>${q[1].map((o,j)=>`<div class="opt ${j===d.correct[i]?'ok':j===ans[i]?'no':''}">${j===d.correct[i]?'✔':j===ans[i]?'✖':'•'} ${esc(o)}</div>`).join('')}</div>`).join('')}`);
}

/* ---------- SUCCESS REPORT ---------- */
function report(){
 const u=user(),c=COURSES.find(x=>x.id===S.course),p=prog(u,c.id),d=new Date(p.date.replace(' ','T')+'Z').toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});
 shell(`<button class="back" onclick="course()">← Back to course</button>
 <div class="rep"><div class="inn"><div class="rh"><div class="brand" style="color:var(--g)"><span class="logo" style="background:var(--g);color:var(--y)">L</span>LEOGAR</div><div class="mut" style="text-align:right">Report ID<br><b style="color:var(--g)">${p.rid}</b></div></div>
 <h1>Success Report</h1><span class="pill">✔ PASSED</span>
 <p style="text-align:center" class="mut">This report confirms that the learner below has successfully completed the course and cleared the assessment.</p>
 <table class="tb"><tr><td>Learner name</td><td>${esc(u.name)}</td></tr><tr><td>College</td><td>${esc(u.college)}</td></tr><tr><td>Email</td><td>${esc(u.email)}</td></tr><tr><td>Phone</td><td>${esc(u.phone)}</td></tr>
 <tr><td>Course</td><td>${c.title}</td></tr><tr><td>Lesson tests passed</td><td>5 of 5</td></tr><tr><td>Average test score</td><td>${p.score}% (pass mark ${PASS_MARK}% per test)</td></tr><tr><td>Date of completion</td><td>${d}</td></tr></table>
 <div class="bar" style="height:12px;margin-top:14px"><i style="width:${p.score}%"></i></div>
 <div class="sg"><div>Learner signature</div><div>Authorised by LEOGAR</div></div></div></div>
 <div style="text-align:center;margin-top:10px"><button class="btn y" onclick="print()">🖨 Print / Save as PDF</button></div>`);
}

TOKEN?load().then(home).catch(logout):authView();
</script>
</body>
</html>
